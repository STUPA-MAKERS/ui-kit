name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The functional-style warnings must not grow: lower the cap when the count drops.
      - run: npm run lint:functional
      - run: npm run build
      - run: npm test -- --ci

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The kit and STUPA-Workflow share one spec number space (002211).
      - uses: actions/checkout@v4
        with:
          repository: STUPA-MAKERS/STUPA-Workflow
          ref: development
          path: partner
          sparse-checkout: specs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/check_specs.py
        env:
          PARTNER_SPECS: partner/specs
