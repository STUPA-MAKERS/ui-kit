<app-dialog
  [open]="open()"
  [heading]="title()"
  [subtitle]="subtitle()"
  [closeLabel]="'dialog.close' | uiKitT"
  [actions]="actions()"
  (action)="onAction($event.key)"
  (closed)="cancel.emit()"
>
  <ng-template dialogBody>
    <div class="cfd">
      @if (body()) {
        <p class="cfd__body">{{ body() }}</p>
      }
      <ng-content />
    </div>
  </ng-template>
</app-dialog>
