<div class="es" [class.es--plain]="plain()" [class.es--one]="one()" [class.es--face]="face()">
  @if (face()) {
    <svg class="es__face" viewBox="0 0 132 106" aria-hidden="true" focusable="false">
      @for (d of dots; track $index) {
        <g
          class="es__dotWobble"
          [style.animation-duration]="d.wobble"
          [style.animation-delay]="d.wobbleDelay"
        >
          <circle
            class="es__dot"
            [attr.cx]="d.x"
            [attr.cy]="d.y"
            [attr.r]="d.r"
            [style.animation-duration]="d.flicker"
            [style.animation-delay]="d.flickerDelay"
          />
        </g>
      }
      <g class="es__eyes">
        <rect class="es__eye" x="42" y="34" width="20" height="16" rx="6" />
        <rect class="es__eye" x="72" y="30" width="20" height="16" rx="6" />
        <g class="es__pupils">
          <rect class="es__pupil" x="48" y="38" width="8" height="8" rx="3" />
          <rect class="es__pupil" x="78" y="34" width="8" height="8" rx="3" />
        </g>
      </g>
      <path class="es__mouth" d="M58 63.5q9-3 18 0" />
    </svg>
  } @else if (one()) {
    <div class="es__ghosts" aria-hidden="true">
      <div class="es__ghost es__ghost--one"></div>
    </div>
  }
  <div class="es__msg">
    @if (code(); as c) {
      <p class="es__code">{{ c }}</p>
    } @else if (plain()) {
      <app-icon class="es__icon" [name]="icon()" [size]="32" />
    }
    @switch (headingLevel()) {
      @case (1) {
        <h1 class="es__heading">{{ heading() }}</h1>
      }
      @case (2) {
        <h2 class="es__heading">{{ heading() }}</h2>
      }
      @case (3) {
        <h3 class="es__heading">{{ heading() }}</h3>
      }
      @default {
        <p class="es__heading">{{ heading() }}</p>
      }
    }
    @if (body(); as text) {
      <p class="es__body">{{ text }}</p>
    }
    <!-- Projected, so the caller decides whether there is a way forward at all. -->
    <div class="es__action">
      <ng-content />
    </div>
  </div>
</div>
