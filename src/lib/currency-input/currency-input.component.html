<div class="fld">
  <span
    class="cur"
    [class.cur--labelled]="!!label()"
    [class.cur--invalid]="!!shownError()"
    [class.cur--disabled]="disabled()"
  >
    @if (label()) {
      <label class="cur__label">
        {{ label() }}
        @if (required()) {
          <span class="text-danger ms-[2px]" aria-hidden="true">*</span>
        }
      </label>
    }
    <input
      class="cur__input"
      type="text"
      inputmode="decimal"
      [value]="text()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel() || label() || null"
      [attr.aria-invalid]="shownError() ? 'true' : null"
      [attr.name]="name() || null"
      (focus)="onFocus()"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />
    <span class="cur__symbol" aria-hidden="true">€</span>
  </span>
  @if (hint() && !shownError()) {
    <p class="cur__msg text-muted">{{ hint() }}</p>
  }
  @if (shownError(); as msg) {
    <p class="cur__msg text-danger" role="alert">{{ msg }}</p>
  }
</div>
