<mat-checkbox
  class="cbx"
  [id]="id"
  [checked]="checked()"
  [indeterminate]="indeterminate()"
  [disabled]="disabled()"
  [aria-describedby]="hint ? id + '-hint' : ''"
  (change)="onToggle($event.checked)"
  (indeterminateChange)="keepMixed()"
  (focusout)="onTouched()"
  ><span class="cbx__label"><ng-content /></span
></mat-checkbox>
@if (hint) {
  <p class="cbx__hint" [id]="id + '-hint'">{{ hint }}</p>
}
