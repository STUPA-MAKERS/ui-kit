@if (icon(); as glyph) {
  <app-icon [name]="glyph" [size]="iconPx()" />
} @else {
  <span class="av__letters">{{ letters() }}</span>
}
@if (src(); as url) {
  <img
    class="av__img"
    [class.av__img--on]="loaded()"
    [src]="url"
    alt=""
    decoding="async"
    loading="lazy"
    (load)="onLoad()"
    (error)="onError()"
  />
}
