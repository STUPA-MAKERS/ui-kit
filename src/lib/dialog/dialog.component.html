@if (open) {
  <div
    #backdrop
    class="dialog__backdrop"
    role="presentation"
    popover="manual"
    animate.enter="dialog--entering"
    animate.leave="dialog--leaving"
    (click)="onBackdrop($event)"
  >
    <div
      #pane
      class="dialog"
      [class.dialog--md]="size === 'md'"
      [class.dialog--lg]="size === 'lg'"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="subtitle ? subtitleId : null"
    >
      <!-- Mobile-Sheet: Greifleiste + Header sind die Drag-Zone zum
           Herunterwischen (Flick schließt). Auf Desktop ausgeblendet (#14). -->
      <div
        class="dialog__drag"
        (touchstart)="onDragStart($event)"
        (touchmove)="onDragMove($event)"
        (touchend)="onDragEnd($event)"
      >
        <span class="dialog__grabber" aria-hidden="true"></span>
        <header class="dialog__header">
          <div class="dialog__heading">
            <h2 class="dialog__title" [id]="titleId">{{ heading }}</h2>
            @if (subtitle) {
              <p class="dialog__subtitle" [id]="subtitleId">{{ subtitle }}</p>
            }
          </div>
          <button
            type="button"
            class="dialog__close"
            [attr.aria-label]="closeLabel"
            [attr.title]="closeLabel"
            (click)="close()"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>
      </div>
      <div class="dialog__body">
        @if (bodySlot; as slot) {
          <ng-container [ngTemplateOutlet]="slot.template" />
        }
      </div>
      @if (actions.length) {
        <footer class="dialog__footer btn-grp btn-grp--main">
          @for (a of actions; track a.key) {
            <app-button
              [variant]="variantOf(a)"
              [disabled]="!!a.disabled"
              [loading]="!!a.busy"
              (click)="action.emit({ key: a.key })"
            >
              @if (a.icon; as icon) {
                <app-icon [name]="icon" />
              }
              {{ a.label }}
            </app-button>
          }
        </footer>
      }
    </div>
  </div>
}
