@if (open) {
  <div class="dialog__backdrop" (click)="onBackdrop($event)">
    <div
      #pane
      class="dialog"
      [class.dialog--lg]="size === 'lg'"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="subtitle ? subtitleId : null"
      (click)="$event.stopPropagation()"
    >
      <!-- Mobile-Sheet: Greifleiste + Header sind die Drag-Zone zum
           Herunterwischen (Flick schließt). Auf Desktop ausgeblendet (#14). -->
      <div
        class="dialog__drag"
        (touchstart)="onDragStart($event)"
        (touchmove)="onDragMove($event)"
        (touchend)="onDragEnd($event)"
      >
        <span class="dialog__grabber" aria-hidden="true"></span>
        <header class="dialog__header">
          <div class="dialog__heading">
            <h2 class="dialog__title" [id]="titleId">{{ title }}</h2>
            @if (subtitle) {
              <p class="dialog__subtitle" [id]="subtitleId">{{ subtitle }}</p>
            }
          </div>
          <button
            type="button"
            class="dialog__close"
            [attr.aria-label]="closeLabel"
            [attr.title]="closeLabel"
            (click)="close()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </header>
      </div>
      <div class="dialog__body"><ng-content /></div>
      <footer class="dialog__footer"><ng-content select="[dialog-footer]" /></footer>
    </div>
  </div>
}
