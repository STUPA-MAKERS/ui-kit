<span class="sw" [class.sw--disabled]="isDisabled()">
  <label class="sw__label" [for]="id()"><ng-content /></label>
  <button
    type="button"
    role="switch"
    class="sw__track"
    [class.sw__track--on]="checked()"
    [id]="id()"
    [disabled]="isDisabled()"
    [attr.aria-checked]="checked()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="hint() ? id() + '-hint' : null"
    (click)="toggle()"
    (blur)="onTouched()"
  >
    <span class="sw__thumb" aria-hidden="true"></span>
  </button>
</span>
@if (hint()) {
  <p class="sw__hint" [id]="id() + '-hint'">{{ hint() }}</p>
}
