<span class="sw" [class.sw--disabled]="isDisabled()">
  <label class="sw__label" [for]="id() + '-button'" [id]="id() + '-label'"><ng-content /></label>
  <mat-slide-toggle
    class="sw__toggle"
    [id]="id()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [hideIcon]="true"
    [aria-label]="ariaLabel() || null"
    [aria-labelledby]="ariaLabel() ? null : id() + '-label'"
    [aria-describedby]="hint() ? id() + '-hint' : ''"
    (change)="set($event.checked)"
    (focusout)="onTouched()"
  />
</span>
@if (hint()) {
  <p class="sw__hint" [id]="id() + '-hint'">{{ hint() }}</p>
}
