<button
  #trigger
  type="button"
  class="chip rc__chip"
  [class.on]="active()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  @if (active()) {
    <app-icon name="check" [size]="15" />
  }
  <span
    class="ell"
    [appTruncated]="chipText()"
    #chipCut="appTruncated"
    [attr.title]="chipCut.truncated() ? chipText() : null"
    >{{ chipText() }}</span
  >
  @if (!active()) {
    <app-icon class="rc__chev" name="down" [size]="15" />
  }
</button>

<ng-template #rangeForm>
  <div class="rc__form">
    <div class="rc__fields" role="group" [attr.aria-label]="label()">
      @if (kind() === 'amount') {
        <app-currency-input
          name="rangeFrom"
          [label]="'range.from' | uiKitT"
          [ngModel]="draftFrom()"
          (ngModelChange)="draftFrom.set($event ?? '')"
        />
        <app-currency-input
          name="rangeTo"
          [label]="'range.to' | uiKitT"
          [ngModel]="draftTo()"
          (ngModelChange)="draftTo.set($event ?? '')"
        />
      } @else {
        <app-datepicker
          name="rangeFrom"
          [label]="'range.from' | uiKitT"
          [ngModel]="draftFrom()"
          (ngModelChange)="draftFrom.set($event ?? '')"
        />
        <app-datepicker
          name="rangeTo"
          [label]="'range.to' | uiKitT"
          [ngModel]="draftTo()"
          (ngModelChange)="draftTo.set($event ?? '')"
        />
      }
    </div>
    @if (!draftValid()) {
      <p class="rc__error" role="alert">{{ 'range.invalid' | uiKitT }}</p>
    }
    <div class="rc__actions btn-grp btn-grp--main">
      <app-button variant="text" (click)="reset()">{{ 'range.reset' | uiKitT }}</app-button>
      <app-button variant="fill" [disabled]="!draftValid()" (click)="apply()">{{
        'range.apply' | uiKitT
      }}</app-button>
    </div>
  </div>
</ng-template>

@if (popoverOpen()) {
  <div
    #pop
    class="rc__pop"
    popover="manual"
    role="dialog"
    tabindex="-1"
    appFocusDialog
    appFocusDialogStart="none"
    [attr.aria-label]="label()"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
    (keydown)="onPopKey($event)"
  >
    <ng-container [ngTemplateOutlet]="rangeForm" />
  </div>
}

@if (sheetOpen()) {
  <div #layer class="rc__layer" popover="manual">
    <app-side-sheet
      side="bottom"
      [heading]="label()"
      [open]="true"
      (openChange)="onSheetOpen($event)"
    >
      <ng-template sheetBody><ng-container [ngTemplateOutlet]="rangeForm" /></ng-template>
    </app-side-sheet>
  </div>
}
