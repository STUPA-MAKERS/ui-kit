<div class="fld__text">
  <span class="fld__label" [attr.lang]="labelLang()">{{ label() }}</span>
  <span class="fld__value" [class.mono]="mono()">
    @if (value() !== null) {
      {{ value() }}
    }
    <ng-content />
  </span>
</div>
<span class="fld__trail"><ng-content select="[trail]" /></span>
