<div
  #track
  class="seg"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-disabled]="isDisabled() ? 'true' : null"
>
  <span #pill class="seg__pill" aria-hidden="true"></span>
  @for (opt of options(); track opt.value; let i = $index) {
    <button
      type="button"
      role="radio"
      class="seg__opt"
      [class.seg__opt--on]="opt.value === value()"
      [attr.aria-checked]="opt.value === value()"
      [attr.tabindex]="opt.value === focusValue() ? 0 : -1"
      [attr.title]="opt.title || null"
      [disabled]="isDisabled() || !!opt.disabled"
      (click)="select(opt)"
      (keydown)="onKeydown($event, i)"
      (blur)="onTouched()"
    >
      <span class="seg__label" [attr.data-label]="opt.label">{{ opt.label }}</span>
    </button>
  }
</div>
