<div class="seg" role="radiogroup" [attr.aria-label]="ariaLabel() || null" [attr.aria-disabled]="isDisabled() ? 'true' : null">
  @for (opt of options(); track opt.value; let i = $index) {
    <button
      type="button"
      role="radio"
      class="seg__opt"
      [class.seg__opt--on]="opt.value === value()"
      [attr.aria-checked]="opt.value === value()"
      [attr.tabindex]="opt.value === focusValue() ? 0 : -1"
      [disabled]="isDisabled() || !!opt.disabled"
      (click)="select(opt)"
      (keydown)="onKeydown($event, i)"
      (blur)="onTouched()"
    >
      @if (opt.value === value()) {
        <svg
          class="seg__check"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      }
      <span class="seg__label">{{ opt.label }}</span>
    </button>
  }
</div>
