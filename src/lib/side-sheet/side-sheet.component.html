@if (open()) {
  <div
    class="ss__scrim"
    aria-hidden="true"
    animate.enter="ss__scrim--entering"
    animate.leave="ss__scrim--leaving"
    (click)="close()"
  ></div>
  <div
    #pane
    [class]="'ss ss--' + side()"
    [class.ss--dragging]="dragging()"
    animate.enter="ss--entering"
    (animate.leave)="leave($event)"
    [style.transform]="dragY() ? 'translateY(' + dragY() + 'px)' : null"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="id"
    (keydown)="onKey($event)"
  >
    <div
      class="ss__top"
      (pointerdown)="dragStart($event)"
      (pointermove)="dragMove($event)"
      (pointerup)="dragEnd($event)"
      (pointercancel)="dragEnd($event)"
    >
      @if (side() === 'bottom') {
        <div class="ss__grip" aria-hidden="true"><span class="ss__handle"></span></div>
      }
      <header class="ss__head">
        <h2 class="ss__title" [id]="id">{{ heading() }}</h2>
        <div class="ss__actions btn-grp">
          @for (a of headActions(); track a.key) {
            @if (a.icon; as icon) {
              <app-button
                variant="text"
                [iconOnly]="true"
                [ariaLabel]="a.label"
                [disabled]="!!a.disabled"
                (click)="action.emit({ key: a.key })"
              >
                <app-icon [name]="icon" />
              </app-button>
            } @else {
              <app-button
                variant="text"
                [disabled]="!!a.disabled"
                (click)="action.emit({ key: a.key })"
                >{{ a.label }}</app-button
              >
            }
          }
          @if (menu().length) {
            <app-row-menu [sections]="menu()" (selected)="action.emit({ key: $event.id })" />
          }
          <app-button
            class="ss__close"
            variant="text"
            [iconOnly]="true"
            [ariaLabel]="'dialog.close' | uiKitT"
            (click)="close()"
          >
            <app-icon name="x" />
          </app-button>
        </div>
      </header>
    </div>
    <div
      #body
      class="ss__body"
      [class.ss__body--fill]="contentScrolls()"
      [class.ss__body--fadeTop]="fadeTop()"
      [class.ss__body--fadeBottom]="fadeBottom()"
    >
      @if (bodySlot(); as slot) {
        <ng-container [ngTemplateOutlet]="slot.template" />
      }
    </div>
  </div>
}
