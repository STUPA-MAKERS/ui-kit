<div class="tabs" role="tablist" [attr.aria-label]="ariaLabel() || null">
  @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      type="button"
      role="tab"
      class="tabs__tab"
      [class.tabs__tab--on]="tab.id === current()"
      [id]="tabId(tab.id)"
      [attr.aria-selected]="tab.id === current()"
      [attr.aria-controls]="panelId(tab.id)"
      [attr.tabindex]="tab.id === current() ? 0 : -1"
      [attr.aria-label]="accessibleName(tab)"
      [disabled]="!!tab.disabled"
      (click)="select(tab)"
      (keydown)="onKeydown($event, i)"
    >
      <span class="tabs__label">{{ tab.label }}</span>
      @if (tab.count !== null && tab.count !== undefined) {
        <span class="tabs__count num">{{ tab.count }}</span>
      }
    </button>
  }
</div>
