<span
    class="badge"
    [class]="color ? 'badge--custom' : 'badge--' + variant"
    [class.badge--tag]="!color && !isStatus"
    [class.badge--status]="!!color || isStatus"
    [style.--badge-text-light]="statusText?.light ?? null"
    [style.--badge-text-dark]="statusText?.dark ?? null"
    ><ng-content
  /></span>
