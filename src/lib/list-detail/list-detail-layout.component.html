<!-- While a swipe back runs, the list shows under the detail (`ld__list--under`): inert,
     because the finger acts on the detail. -->
<div
  #listPane
  class="ld__list"
  [class.ld__list--under]="swiping()"
  tabindex="-1"
  [hidden]="collapsed() && detailOpen() && !swiping()"
  [attr.inert]="swiping() ? '' : null"
>
  <ng-content select="[list]" />
</div>
<div
  #detailPane
  class="ld__detail"
  [class.ld__detail--bar]="nav.active()"
  [class.ld__detail--swiping]="swiping()"
  tabindex="-1"
  [hidden]="collapsed() && !detailOpen()"
  appSwipeBack
  [appSwipeBackOff]="!collapsed() || !detailOpen()"
  [appSwipeBackUnder]="listPane"
  (appSwipeBackStart)="onSwipeStart()"
  (appSwipeBack)="onSwipeBack()"
  (appSwipeBackEnd)="onSwipeEnd()"
>
  @if (nav.active()) {
    <app-list-detail-bar (back)="back.emit()" />
  }
  <ng-content select="[detail]" />
</div>
