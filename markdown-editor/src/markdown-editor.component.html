<div #host class="mde__host" [class.mde__host--disabled]="disabled()"></div>
@if (slashMenu(); as sm) {
  <div
    #slashList
    class="mde__slash"
    popover="manual"
    role="listbox"
    [id]="slashId"
    [attr.aria-label]="'editorSlash.menu' | uiKitT"
  >
    @for (command of sm.commands; track command.id; let i = $index) {
      <button
        type="button"
        role="option"
        tabindex="-1"
        class="mde__slashItem"
        [class.mde__slashItem--active]="i === sm.active"
        [id]="slashId + '-' + i"
        [attr.aria-selected]="i === sm.active"
        (mousedown)="$event.preventDefault()"
        (mouseenter)="slash.mark(i)"
        (click)="runSlash(command.id)"
      >
        <app-icon class="mde__slashIcon" [name]="command.icon" [size]="20" />
        <span>{{ command.label }}</span>
      </button>
    }
  </div>
}
@if (tableControls(); as tc) {
  @if (tc.colX !== null) {
    <app-row-menu
      class="mde__grip mde__grip--col"
      icon="grip-h"
      align="start"
      [style.left.px]="tc.colX"
      [style.top.px]="tc.top"
      [label]="'editorTable.columnMenu' | uiKitT"
      [sections]="columnMenu()"
      (selected)="onTableMenu($event)"
    />
  }
  <app-row-menu
    class="mde__grip mde__grip--row"
    icon="grip"
    align="start"
    [style.left.px]="tc.left"
    [style.top.px]="tc.rowY"
    [label]="'editorTable.rowMenu' | uiKitT"
    [sections]="rowMenu()"
    (selected)="onTableMenu($event)"
  />
  <app-row-menu
    class="mde__tableMenu"
    icon="more"
    [style.left.px]="tc.visibleRight"
    [style.top.px]="tc.top"
    [label]="'editorTable.menu' | uiKitT"
    [sections]="tableMenu()"
    (selected)="onTableMenu($event)"
  />
  <button
    type="button"
    class="mde__add mde__add--col"
    [style.left.px]="tc.visibleRight"
    [style.top.px]="tc.top"
    [style.--mde-table-h.px]="tc.bottom - tc.top"
    [attr.aria-label]="'editorTable.addColumn' | uiKitT"
    [title]="'editorTable.addColumn' | uiKitT"
    (mousedown)="$event.preventDefault()"
    (click)="appendTable('column')"
  >
    <app-icon name="plus" [size]="18" />
  </button>
  <button
    type="button"
    class="mde__add mde__add--row"
    [style.left.px]="tc.visibleLeft"
    [style.top.px]="tc.bottom"
    [style.width.px]="tc.visibleRight - tc.visibleLeft"
    [attr.aria-label]="'editorTable.addRow' | uiKitT"
    [title]="'editorTable.addRow' | uiKitT"
    (mousedown)="$event.preventDefault()"
    (click)="appendTable('row')"
  >
    <app-icon name="plus" [size]="18" />
  </button>
}
@if (selectionBarPlace(); as sb) {
  <div
    #selectionBar
    class="mde__selbar"
    role="toolbar"
    tabindex="-1"
    [class.mde__selbar--above]="sb.above"
    [style.left.px]="sb.left"
    [style.top.px]="sb.top"
    [attr.aria-label]="'editorSelection.toolbar' | uiKitT"
    (keydown)="onSelectionBarKey($event)"
  >
    <app-button-group>
      @for (tool of selectionTools; track tool.format) {
        <app-button
          variant="tonal"
          [iconOnly]="true"
          [ariaPressed]="activeFormats().has(tool.format)"
          [ariaLabel]="tool.label | uiKitT"
          [title]="tool.label | uiKitT"
          (pointerdown)="$event.preventDefault()"
          (mousedown)="$event.preventDefault()"
          (click)="onSelectionTool(tool.format)"
          ><app-icon [name]="tool.icon"
        /></app-button>
      }
    </app-button-group>
  </div>
}
