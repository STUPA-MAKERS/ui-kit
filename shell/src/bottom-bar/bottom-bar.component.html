<nav class="bb" [attr.aria-label]="'shell.mainNav' | uiKitT">
  @for (item of barItems(); track item.key) {
    <a
      class="bb__item"
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
    >
      <span class="bb__ind">
        <app-icon [name]="item.icon" [size]="22" />
        @if (mark(); as m) {
          <ng-container *ngTemplateOutlet="m; context: { $implicit: item.key, part: 'visual' }" />
        }
      </span>
      <span class="bb__label">{{ item.label }}</span>
      @if (mark(); as m) {
        <ng-container *ngTemplateOutlet="m; context: { $implicit: item.key, part: 'text' }" />
      }
    </a>
  }
  <div class="bb__end"><ng-content select="[barEnd]" /></div>
  @if (more()) {
    <button
      type="button"
      class="bb__item"
      [class.is-active]="moreActive()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="moreOpen()"
      (click)="openMore()"
    >
      <span class="bb__ind"><app-icon name="menu" [size]="22" /></span>
      <span class="bb__label">{{ 'shell.more' | uiKitT }}</span>
    </button>
  }
</nav>

@if (more()) {
  <app-side-sheet side="bottom" [heading]="'shell.more' | uiKitT" [(open)]="moreOpen">
    <div class="more">
      @if (moreItems().length > 0) {
        <div class="more__group">
          @for (item of moreItems(); track item.key) {
            <a
              class="more__item"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              (click)="closeMore()"
            >
              <app-icon [name]="item.icon" [size]="20" />
              <span class="ell more__label">{{ item.label }}</span>
              @if (mark(); as m) {
                <ng-container
                  *ngTemplateOutlet="m; context: { $implicit: item.key, part: 'count' }"
                />
                <ng-container
                  *ngTemplateOutlet="m; context: { $implicit: item.key, part: 'text' }"
                />
              }
            </a>
          }
        </div>
      }
      @if (searchable()) {
        <div class="more__group">
          <button type="button" class="more__item" (click)="onSearch()">
            <app-icon name="search" [size]="20" />
            <span class="ell">{{ 'shell.search' | uiKitT }}</span>
          </button>
        </div>
      }
      <ng-content select="[more]" />
      <ng-content select="[moreAccount]" />
    </div>
  </app-side-sheet>
}
