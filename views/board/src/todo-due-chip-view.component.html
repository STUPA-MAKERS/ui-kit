<span class="dc">
  <button
    type="button"
    class="chip dc__chip"
    [disabled]="disabled()"
    (click)="pick()"
  >
    <span class="sr-only">{{ (text() ? 'todos.due.change' : 'todos.due.set') | uiKitT: { date: '' } }}</span>
    <app-icon name="cal" [size]="15" />
    <span class="chip__text">{{ text() ?? ('todos.due.none' | uiKitT) }}</span>
    @if (!disabled()) {
      <app-icon class="dc__chev" name="down" [size]="15" />
    }
  </button>
  <input
    #native
    class="dc__native"
    type="date"
    tabindex="-1"
    aria-hidden="true"
    (change)="onNative($any($event.target).value)"
  />
</span>
