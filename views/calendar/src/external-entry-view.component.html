@let e = entry();
<app-dialog
  [open]="open() && !!e"
  [heading]="e?.title ?? ''"
  [closeLabel]="'action.close' | uiKitT"
  (closed)="closed.emit()"
>
  <ng-template dialogBody>
    @if (e) {
      <div class="apv">
        <dl appFacts layout="rows">
          <div>
            <dt>{{ 'calendar.detail.when' | uiKitT }}</dt>
            <dd class="mono">{{ when() }}</dd>
          </div>
          @if (e.place) {
            <div>
              <dt>{{ 'calendar.field.place' | uiKitT }}</dt>
              <dd>{{ e.place }}</dd>
            </div>
          }
          <div>
            <dt>{{ 'calendar.external.calendar' | uiKitT }}</dt>
            <dd>{{ e.calendar }}</dd>
          </div>
        </dl>
        @if (e.description) {
          <p class="apv__desc">{{ e.description }}</p>
        }
      </div>
    }
  </ng-template>
</app-dialog>
