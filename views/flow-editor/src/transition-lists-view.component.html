@for (col of columns(); track col.key) {
  <app-section [heading]="col.title | uiKitT">
    @if (col.rows.length) {
      <div class="rowgroup" role="list">
        @for (r of col.rows; track r.index) {
          <app-list-item role="listitem" [title]="r.label || r.from + ' → ' + r.to" [wrap]="true" (activate)="selectTransition.emit(r.index)">
            @if (r.automatic) {
              <app-icon lead class="tl__bolt" name="bolt" role="img" [size]="20" [attr.aria-label]="'admin.flow.legendAutomatic' | uiKitT" />
            }
            <app-meta-line sub>
              <span class="mono">{{ r.from }} → {{ r.to }}</span>
              @if (r.branch) {
                <span>{{ r.branch }}</span>
              }
              <span>{{ r.guard }}</span>
            </app-meta-line>
          </app-list-item>
        }
      </div>
    } @else {
      <app-empty-state icon="flow" rows="1" [heading]="'admin.flow.list.empty' | uiKitT" />
    }
  </app-section>
}
